name: V2.4 课程与浏览器回归
on:
  push:
    branches:
      - feature/digital-course-v2.4
      - feature/digital-course-v2.4.1
  pull_request:
  workflow_dispatch:

jobs:
  legacy-and-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: 锁文件可复现安装依赖
        run: npm ci --no-audit --no-fund
      - name: 运行旧版逻辑回归
        run: npm run test:legacy
      - name: 运行 V2.3 结构兼容检查
        run: npm run test:structure
      - name: 运行 V2.4 拆分结构回归
        run: npm run test:split
      - name: 审计未拆分的脚本和资源引用
        run: npm run test:audit
      - name: 检查数字电路教学计算一致性
        run: npm run test:teaching
      - name: 检查学习闭环与重点知识点一致性
        run: npm run test:loop
      - name: 检查 V2.4 发布元信息
        run: npm run test:release
      - name: 检查 V2.4.1 工程结构与设计系统
        run: npm run test:v241
      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium
      - name: 运行 V2.3 + V2.4 浏览器测试
        run: npm run test:browser
      - name: 保存失败截图和追踪
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v24-browser-debug
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
